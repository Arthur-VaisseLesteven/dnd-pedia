<script type="text/javascript">
    let classDisplay = document.querySelector('character-class-display');
    classDisplay.setData({
          "name": {
            "fr": "Manuel du Joueur",
            "en": "Player Handbook"
          }
        }, {
  "name": {
    "en": "Barbarian",
    "fr": "Barbare"
  },
  "lore": {
    "en": [
      { "content": "From the frozen wastes of the north and the hellish jungles of the south come brave, even reckless, warriors. Civilized people call them barbarians or berserkers and suspect them of mayhem, impiety, and atrocities. These 'barbarians,' however, have proven their mettle and their value to those who would be their allies. To enemies who underestimated them, they have proved their cunning, resourcefulness, persistence, and mercilessness." },
      { "title": "Adventures", "content": "Adventuring is the best chance barbarians have of finding a place in a civilized society. They’re not well suited to the monotony of guard duty or other mundane tasks. Barbarians also have no trouble with the dangers, the uncertainties, and the wandering that adventuring involves. They may adventure to defeat hated enemies. They also have a noted distaste for that which they consider unnatural, including undead, demons, and devils." },
      { "title": "Characteristics", "content": "The barbarian is an excellent warrior. Wherethe fighter’s skill in combat comes from training and discipline, however, the barbarian has a powerful rage. While in this berserk fury, he becomes stronger and tougher, better able to defeat his foes and withstand their attacks. These rages leave him winded, and he has the energy for only a few such spectacular displays per day, but those few rages are usually sufficient. He is at home in the wild, and he runs at great speed." },
      { "title": "Alignment", "content": "Barbarians are never lawful. They may be honorable, but at heart they are wild. This wildness is their strength, and it could not live in a lawful soul. At best, barbarians of chaotic alignment are free and expressive. At worst, they are thoughtlessly destructive." },
      { "title": "Religion", "content": "Some barbarians distrust established religions and prefer an intuitive, natural relationship to the cosmos over formal worship. Others devote themselves to powerful deities, such as Kord (god of strength), Obad-Hai (god of nature), or Erythnul (god of slaughter). A barbarian is capable of fierce devotion to his god." },
      { "title": "Background", "content": "Barbarians come from uncivilized lands or from barbaric tribes on the outskirts of civilization. A barbarian adventurer may have been lured to the settled lands by the promise of riches, may have escaped after being captured in his homeland and sold into “civilized” slavery, may have been recruited as a soldier, or may have been driven out of his homeland by invaders. Barbarians share no bond with each other unless they come from the same tribe or land. In fact, they think of themselves not as barbarians but as warriors." },
      { "title": "Races", "content": "Human barbarians come from the distant wild lands on the edge of civilization. Most half-orc barbarians lived among orcs before abandoning them for human lands. Dwarf barbarians are rare, usually hailing from dwarven kingdoms that have fallen into barbarism as a result of recurrent war with goblinoids, orcs, and giants. Barbarians of other races are very rare. Among the brutal humanoids, barbarians are more common than fighters. Orcs and ogres are especially likely to be barbarians." },
      { "title": "Other Classes", "content": "As people of the wild, barbarians are most comfortable in the company of rangers, druids, and clerics of nature deities, such as Obad-Hai or Ehlonna. Many barbarians admire the talents and spontaneity of bards, and some are enthusiastic lovers of music. Barbarians don’t trust that which they don’t understand, and that includes wizardry, which they call “book magic.” They find sorcerers more understandable than wizards, but maybe that’s just because sorcerers tend to be more charismatic. Monks, with their studied, practiced, deliberate approach to combat, sometimes have a hard time seeing eye to eye with barbarians, but members of these classes aren’t necessarily hostile to each other. Barbarians have no special attitude toward fighters, paladins, clerics, or rogues." },
      { "title": "Role", "content": "A barbarian’s typical primary role in a group of adventurers is as a front-line combat specialist. No other character can match his sheer toughness. He can also serve as a good scout, thanks to his speed, skill selection, and trap sense." }
    ],
    "fr": [
      { "content": "Des terres désolées du nord et des jungles infernales du sud émergent des guerriers courageux, voire téméraires. Les peuples civilisés les appellent barbares ou berserkers, les accusant de violence, d’impiété et d’atrocités. Pourtant, ces 'barbares' ont prouvé leur valeur à ceux qui sont devenus leurs alliés. Face à des ennemis les sous-estimant, ils déploient ruse, ingéniosité, persévérance et impitoyabilité." },
      { "title": "Aventures", "content": "L’aventure offre au barbare sa meilleure chance de trouver une place dans une société civilisée. Il n’est pas adapté à la monotonie de la garde ou à d’autres tâches ordinaires. Les barbares ne redoutent ni les dangers, ni les incertitudes, ni l’errance inhérente à l’aventure. Ils peuvent partir en quête pour vaincre des ennemis haïs. Ils éprouvent également une aversion marquée pour ce qu’ils considèrent comme contre nature, y compris les morts-vivants, les démons et les diables." },
      { "title": "Caractéristiques", "content": "Le barbare est un guerrier hors pair. Là où le combattant puise sa force dans l’entraînement et la discipline, le barbare possède une rage puissante. Dans cet accès de frénésie, il devient plus fort et plus endurant, mieux à même de vaincre ses ennemis et de résister à leurs attaques. Ces accès de rage l’épuisent : il ne peut en soutenir que quelques-uns spectaculaires par jour, mais ceux-ci suffisent généralement. Il est à l’aise dans la nature sauvage et peut courir à grande vitesse." },
      { "title": "Alignement", "content": "Les barbares ne sont jamais loyaux. Bien qu’ils puissent être honorables, leur nature profonde reste sauvage. Cette nature sauvage est leur force, et elle ne saurait exister dans une âme loyale. Au mieux, les barbares d’alignement chaotique sont libres et expressifs. Au pire, ils sont destructeurs par négligence." },
      { "title": "Religion", "content": "Certains barbares méprisent les religions organisées et privilégient une relation intuitive et naturelle avec le cosmos plutôt qu’un culte formel. D’autres vouent un culte fervent à des divinités puissantes, comme Kord (dieu de la force), Obad-Haï (dieu de la nature) ou Érythnul (dieu du carnage). Un barbare est capable d’une dévotion farouche envers son dieu." },
      { "title": "Origines", "content": "Les barbares sont originaires de terres sauvages ou de tribus barbares en marge de la civilisation. Un barbare aventurier peut avoir été attiré vers les terres civilisées par la promesse de richesses, avoir été capturé dans son pays natal et vendu comme esclave 'civilisé', avoir été recruté comme soldat, ou avoir été chassé de sa terre natale par des envahisseurs. Les barbares ne partagent pas de lien entre eux sauf s’ils viennent de la même tribu ou terre. Ils ne se voient pas eux-mêmes comme des barbares, mais comme des guerriers." },
      { "title": "Races", "content": "Les barbares humains proviennent des contrées sauvages éloignées, aux marges de la civilisation. La plupart des barbares demi-orques ont vécu parmi les orques avant de les abandonner pour les terres humaines. Les barbares nains sont rares, venant généralement de royaumes nains tombés dans la barbarie à cause de guerres récurrentes contre les gobelinoïdes, les orques et les géants. Les barbares d’autres races sont très rares. Parmi les humanoïdes brutaux, les barbares sont plus courants que les combattants. Les orques et les ogres sont particulièrement susceptibles d’être des barbares." },
      { "title": "Autres classes", "content": "Issus du monde sauvage, les barbares se sentent à l’aise en compagnie des rôdeurs, des druides et des clercs de divinités de la nature, comme Obad-Haï ou Ehlonna. Beaucoup de barbares admirent les talents et la spontanéité des bardes, et certains sont des amateurs enthousiastes de musique. Les barbares ne font pas confiance à ce qu’ils ne comprennent pas, et cela inclut la magie des savants, qu’ils appellent 'la magie des livres'. Ils trouvent les ensorceleurs plus compréhensibles que les magiciens, peut-être simplement parce que les ensorceleurs ont tendance à être plus charismatiques. Les moines, avec leur approche étudiée, pratiquée et délibérée du combat, ont parfois du mal à s’entendre avec les barbares, mais les membres de ces classes ne sont pas nécessairement hostiles les uns envers les autres. Les barbares n’ont pas d’attitude particulière envers les combattants, les paladins, les clercs ou les voleurs." },
      { "title": "Rôle", "content": "Le rôle principal d’un barbare au sein d’un groupe d’aventuriers est généralement celui d’un combattant de première ligne. Aucun autre personnage ne peut rivaliser avec sa robustesse pure. Il peut aussi servir de bon éclaireur, grâce à sa vitesse, ses choix de compétences et son sens des pièges." }
    ]
  },
  "game_rule_information": {
    "en": [
      {"title": "Abilities", "content": "Strength is important for barbarians because of its role in combat, and several barbarian class skills are based on Strength. Dexterity is also useful to barbarians, especially those who wear light armor. Wisdom is also important for several of the barbarian’s class skills. A high Constitution score lets a barbarian rage longer (and live longer, because it gives him more hit points)."},
      {"title": "Alignment", "content": "Any nonlawful"},
      {"title": "Hit Die", "content": "d12"}
    ],
    "fr": [
      {"title": "Caractéristiques", "content": "La Force est essentielle pour les barbares en raison de son rôle dans le combat : plusieurs de leurs compétences de classe y sont liées. La Dextérité est également utile, surtout pour ceux qui portent une armure légère. La Sagesse est importante pour d’autres compétences de classe. Un score élevé de Constitution permet au barbare de rester en rage plus longtemps (et de vivre plus longtemps, car cela lui donne plus de points de vie)."},
      {"title": "Alignement", "content": "Tout alignement non loyal (chaotique ou neutre)"},
      {"title": "Dés de vie", "content": "d12"}
    ]
  },
  "skills": {
    "list": {
      "en": "Climb (Str), Craft (Int), Handle Animal (Cha), Intimidate (Cha), Jump (Str), Listen (Wis), Ride (Dex), Survival (Wis), and Swim (Str)",
      "fr": "Escalade (For), Artisanat (Int), Dressage (Cha), Intimidation (Cha), Saut (For), Perception auditive (Sag), Équitation (Dex), Survie (Sag) et Natation (For)"
    },
    "perLevel": 4
  },
  "features": {
    "en": [
      { "title": "Weapon and Armor Proficiency", "content": "A barbarian is proficient with all simple and martial weapons, light armor, medium armor, and shields (except tower shields)."},
      { "title": "Fast Movement (Ex)", "content": "A barbarian’s land speed is faster than the norm for his race by +10 feet. This benefit applies only when he is wearing no armor, light armor, or medium armor and not carrying a heavy load. Apply this bonus before modifying the barbarian’s speed because of any load carried or armor worn. For example, a human barbarian has a speed of 40 feet, rather than 30 feet, when wearing light or no armor. When wearing medium armor or carrying a medium load, his speed drops to 30 feet. A halfling barbarian has a speed of 30 feet, rather than 20 feet, in light or no armor. When wearing medium armor or carrying a medium load, his speed drops to 20 feet"},
      { "title": "Illiteracy", "content": "Barbarians are the only characters who do not automatically know how to read and write. A barbarian may spend 2 skill points to gain the ability to read and write all languages he is able to speak. A barbarian who gains a level in any other class automatically gains literacy. Any other character who gains a barbarian level does not lose the literacy he or she already had."},
      { "title": "Rage (Ex)", "content": "A barbarian can fly into a screaming blood frenzy a certain number of times per day. In a rage, a barbarian gains phenomenal strength and durability but becomes reckless and less able to defend himself. He temporarily gains a +4 bonus to Strength, a +4 bonus to Constitution, and a +2 morale bonus on Will saves, but he takes a –2 penalty to Armor Class. The increase in Constitution increases the barbarian’s hit points by 2 points per level, but these hit points go away at the end of the rage when his Constitution score drops back to normal. (These extra hit points are not lost first the way temporary hit points are; see Temporary Hit Points, page 146.) While raging, a barbarian cannot use any Charisma-, Dexterity-, or Intelligence-based skills (except for Balance, Escape Artist, Intimidate, and Ride), the Concentration skill, or any abilities that require patience or concentration, nor can he cast spells or activate magic items that require a command word, a spell trigger (such as a wand), or spell completion (such as a scroll) to function. He can use any feat he has except Combat Expertise, item creation feats, and metamagic feats. A fit of rage lasts for a number of rounds equal to 3 + the character’s (newly improved) Constitution modifier. A barbarian may prematurely end his rage. At the end of the rage, the barbarian loses the rage modifiers and restrictions and becomes fatigued (–2 penalty to Strength, –2 penalty to Dexterity, can’t charge or run) for the duration of the current encounter (unless he is a 17th-level barbarian, at which point this limitation no longer applies; see below). A barbarian can fly into a rage only once per encounter. At 1st level he can use his rage ability once per day. At 4th level and every four levels thereafter, he can use it one additional time per day (to a maximum of six times per day at 20th level). Entering a rage takes no time itself, but a barbarian can do it only during his action (see Initiative, page 136), not in response to someone else’s action. A barbarian can’t, for example, fly into a rage when struck down by an arrow in order to get the extra hit points from the increased Constitution, although the extra hit points would be of benefit if he had gone into a rage earlier in the round, before the arrow struck."},
      { "title": "Uncanny Dodge (Ex)", "content": "At 2nd level, a barbarian gains the ability to react to danger before his senses would normally allow him to do so. He retains his Dexterity bonus to AC (if any) even if he is caught flat-footed or struck by an invisible attacker. However, he still loses his Dexterity bonus to AC if immobilized. If a barbarian already has uncanny dodge from a different class (a barbarian with at least four levels of rogue, for example), he automatically gains improved uncanny dodge (see below) instead."},
      { "title": "Trap Sense (Ex)", "content": "Starting at 3rd level, a barbarian has an intuitive sense that alerts him to danger from traps, giving him a +1 bonus on Reflex saves made to avoid traps and a +1 dodge bonus to AC against attacks made by traps. These bonuses rise by +1 every three barbarian levels thereafter (6th, 9th, 12th, 15th, and 18th level). Trap sense bonuses gained from multiple classes stack."},
      { "title": "Improved Uncanny Dodge (Ex)", "content": "At 5th level and higher, a barbarian can no longer be flanked; he can react to opponents on opposite sides of him as easily as he can react to a single attacker. This defense denies a rogue the ability to sneak attack the barbarian by flanking him, unless the attacker has at least four more rogue levels than the target has barbarian levels. If a character already has uncanny dodge (see above) from a second class, the character automatically gains improved uncanny dodge instead, and the levels from the classes that grant uncanny dodge stack to determine the minimum level a rogue must be to flank the character."},
      { "title": "Damage Reduction (Ex)", "content": "At 7th level, a barbarian gains the ability to shrug off some amount of injury from each blow or attack. Subtract 1 from the damage the barbarian takes each time he is dealt damage from a weapon or a natural attack. At 10th level, and every three barbarian levels thereafter (13th, 16th, and 19th level), this damage reduction rises by 1 point. Damage reduction can reduce damage to 0 but not below 0."},
      { "title": "Greater Rage (Ex)", "content": "At 11th level, a barbarian’s bonuses to Strength and Constitution during his rage each increase to +6, and his morale bonus on Will saves increases to +3. The penalty to AC remains at –2."},
      { "title": "Indomitable Will (Ex)", "content": "While in a rage, a barbarian of 14th level or higher gains a +4 bonus on Will saves to resist enchantment spells. This bonus stacks with all other modifiers, including the morale bonus on Will saves he also receives during his rage."},
      { "title": "Tireless Rage (Ex)", "content": "At 17th level and higher, a barbarian no longer becomes fatigued at the end of his rage."},
      { "title": "Mighty Rage (Ex)", "content": "At 20th level, a barbarian’s bonuses to Strength and Constitution during his rage each increase to +8, and his morale bonus on Will saves increases to +4. The penalty to AC remains at –2."}
    ],
    "fr": [
      { "title": "Maîtrise des armes et des armures", "content": "Un barbare est compétent avec toutes les armes simples et de guerre, les armures légères, les armures intermédiaires et les boucliers (sauf les pavois)."},
      { "title": "Déplacement rapide (Ex)", "content": "La vitesse de déplacement d’un barbare est supérieure de 3 mètres à la normale pour sa race. Ce bénéfice s’applique uniquement lorsqu’il ne porte pas d’armure, une armure légère ou une armure intermédiare et ne transporte pas une charge lourde. Applique ce bonus avant de modifier la vitesse du barbare en raison de la charge transportée ou de l’armure portée. Par exemple, un barbare humain a une vitesse de 12 mètres, au lieu de 9 mètres, lorsqu’il porte une armure légère ou aucune armure. Lorsqu’il porte une armure intermédiare ou transporte une charge moyenne, sa vitesse diminue à 9 mètres. Un barbare halfelin a une vitesse de 9 mètres, au lieu de 6 mètres, lorsqu’il porte une armure légère ou aucune armure. Lorsqu’il porte une armure intermédiare ou transporte une charge moyenne, sa vitesse diminue à 6 mètres."},
      { "title": "Illétrisme", "content": "Les barbares sont les seuls personnages qui ne savent pas automatiquement lire et écrire. Un barbare peut dépenser 2 points de compétence pour acquérir la capacité de lire et écrire toutes les langues qu’il parle. Un barbare qui gagne un niveau dans une autre classe acquiert automatiquement la capacité de lire et d’écrire. Tout autre personnage qui gagne un niveau de barbare ne perd pas la capacité de lire et d’écrire qu’il avait déjà."},
      { "title": "Rage (Ex)", "content": "Un barbare peut entrer dans une frénésie guerrière un certain nombre de fois par jour. En rage, un barbare gagne une force et une endurance phénoménales mais devient imprudent et moins capable de se défendre. Il gagne temporairement un bonus de +4 en Force, un bonus de +4 en Constitution et un bonus de moral de +2 aux jets de sauvegarde de Volonté, mais subit une pénalité de –2 à la Classe d’Armure. L’augmentation de Constitution augmente les points de vie du barbare de 2 points par niveau, mais ces points de vie disparaissent à la fin de la rage lorsque son score de Constitution revient à la normale. (Ces points de vie supplémentaires ne sont pas perdus en premier comme le sont les points de vie temporaires.) Enragé, un barbare ne peut utiliser aucune compétence basée sur le Charisme, la Dextérité ou l’Intelligence (sauf Équilibre, Évasion, Intimidation et Équitation), la compétence de Concentration, ni aucune capacité exigeant de la patience ou de la concentration, ni lancer de sorts ou activer des objets magiques nécessitant un mot de commande, un déclenchement par sort (comme une baguette) ou une activation par complétion de sort (comme un parchemin). Il peut utiliser n’importe quel don qu’il possède sauf l’Expertise en combat, les dons de création d’objets et les dons de métamagie. Un accès de rage dure un nombre de rounds égal à 3 plus le modificateur de Constitution (amélioré) du personnage. Un barbare peut mettre fin prématurément à sa rage. À la fin de la rage, le barbare perd les modificateurs et restrictions apportés par la rage et devient épuisé (pénalité de –2 en Force, –2 en Dextérité, ne peut charger ni courir) jusqu’à la fin de l’affrontement actuel (sauf s’il est de niveau 17, auquel cas cette limitation ne s’applique plus). Un barbare ne peut entrer en rage qu’une fois par affrontement. Au niveau 1, il peut utiliser sa capacité de rage une fois par jour. À partir du niveau 4, puis tous les 4 niveaux, il peut l’utiliser une fois de plus par jour (jusqu’à un maximum de 6 fois par jour au niveau 20). Entrer en rage ne prend pas de temps en soi, mais un barbare ne peut le faire que pendant son action, et non en réponse à l’action d’un autre. Un barbare ne peut, par exemple, entrer en rage lorsqu’il est frappé par une flèche pour bénéficier des points de vie supplémentaires apportés par la Constitution augmentée, bien que ces points de vie supplémentaires seraient bénéfiques s’il était entré en rage plus tôt dans le round, avant le coup de flèche."},
      { "title": "Esquive surnaturelle (Ex)", "content": "Au niveau 2, un barbare acquiert la capacité de réagir au danger avant que ses sens ne lui permettent normalement de le faire. Il conserve son bonus de Dextérité à la CA (s’il en a un) même s’il est surpris ou frappé par un attaquant invisible. Cependant, il perd toujours son bonus de Dextérité à la CA s’il est immobilisé. Si un barbare possède déjà l’esquive surnaturelle d’une autre classe (par exemple, un barbare avec au moins quatre niveaux de rôdeur), il acquiert automatiquement l’esquive surnaturelle améliorée (voir ci-dessous)."},
      { "title": "Sens des pièges (Ex)", "content": "À partir du niveau 3, un barbare possède un sens intuitif qui l’alerte des dangers des pièges, lui accordant un bonus de +1 aux jets de sauvegarde de Réflexes pour éviter les pièges et un bonus d’esquive de +1 à la CA contre les attaques des pièges. Ces bonus augmentent de +1 tous les trois niveaux de barbare (niveaux 6, 9, 12, 15 et 18). Les bonus de sens des pièges obtenus de plusieurs classes s’additionnent."},
      { "title": "Esquive surnaturelle améliorée (Ex)", "content": "Au niveau 5 et supérieur, un barbare ne peut plus être pris en tenaille ; il peut réagir aux adversaires de part et d’autre de lui aussi facilement qu’à un seul attaquant. Cette défense empêche un rôdeur de porter une attaque sournoise contre le barbare en le prenant en tenaille, sauf si l’attaquant possède au moins quatre niveaux de rôdeur de plus que le barbare. Si un personnage possède déjà l’esquive surnaturelle d’une deuxième classe, il acquiert automatiquement l’esquive surnaturelle améliorée, et les niveaux des classes accordant l’esquive surnaturelle s’additionnent pour déterminer le niveau minimum qu’un rôdeur doit avoir pour prendre le personnage en tenaille."},
      { "title": "Réduction des dégâts (Ex)", "content": "Au niveau 7, un barbare acquiert la capacité d’ignorer une partie des blessures infligées par chaque coup ou attaque. Soustrais 1 des dégâts subis par le barbare chaque fois qu’il est blessé par une arme ou une attaque naturelle. Aux niveaux 10, 13, 16 et 19, cette réduction des dégâts augmente de 1 point. La réduction des dégâts peut réduire les dégâts à 0 mais pas en dessous."},
      { "title": "Rage supérieure (Ex)", "content": "Au niveau 11, les bonus de Force et de Constitution d’un barbare pendant sa rage augmentent chacun à +6, et son bonus de moral aux jets de sauvegarde de Volonté augmente à +3. La pénalité à la CA reste à –2."},
      { "title": "Volonté indomptable (Ex)", "content": "Pendant sa rage, un barbare de niveau 14 ou supérieur gagne un bonus de +4 aux jets de sauvegarde de Volonté pour résister aux sorts d’enchantement. Ce bonus s’additionne à tous les autres modificateurs, y compris le bonus de moral aux jets de sauvegarde de Volonté qu’il reçoit également pendant sa rage."},
      { "title": "Rage inépuisable (Ex)", "content": "Au niveau 17 et supérieur, un barbare ne devient plus épuisé à la fin de sa rage."},
      { "title": "Rage puissante (Ex)", "content": "Au niveau 20, les bonus de Force et de Constitution d’un barbare pendant sa rage augmentent chacun à +8, et son bonus de moral aux jets de sauvegarde de Volonté augmente à +4. La pénalité à la CA reste à –2."}
    ]
  },

}
