<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0c097"/>
      <stop offset="50%" style="stop-color:#c4956a"/>
      <stop offset="100%" style="stop-color:#8b5e3c"/>
    </linearGradient>
    <linearGradient id="ampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @font-face {
        font-family: 'DragonFont';
        src: url('../css/custom-fonts/dragonlord-webfont.woff2') format('woff2'),
             url('../css/custom-fonts/dragonlord-webfont.woff') format('woff');
      }
      @font-face {
        font-family: 'LibreBaskerville';
        src: url('../css/custom-fonts/librebaskerville-regular-webfont.woff2') format('woff2'),
             url('../css/custom-fonts/librebaskerville-regular-webfont.woff') format('woff');
      }
      @font-face {
        font-family: 'LibreBaskervilleItalic';
        src: url('../css/custom-fonts/librebaskerville-italic-webfont.woff2') format('woff2'),
             url('../css/custom-fonts/librebaskerville-italic-webfont.woff') format('woff');
      }
    </style>
  </defs>

  <!-- Decorative top line -->
  <line x1="100" y1="15" x2="800" y2="15" stroke="#8b5e3c" stroke-width="1" opacity="0.5"/>

  <!-- "Dungeons" -->
  <text x="270" y="90" font-family="DragonFont, serif" font-size="72" fill="url(#textGrad)" filter="url(#glow)" text-anchor="end">Dungeons</text>

  <!-- "&" ampersand -->
  <text x="340" y="105" font-family="DragonFont, serif" font-size="96" fill="url(#ampGrad)" filter="url(#glow)" text-anchor="middle">&amp;</text>

  <!-- "Dragons" -->
  <text x="415" y="90" font-family="DragonFont, serif" font-size="72" fill="url(#textGrad)" filter="url(#glow)" text-anchor="start">Dragons</text>

  <!-- "Pedia" subtitle -->
  <text x="450" y="155" font-family="DragonFont, serif" font-size="64" fill="#4d4d4d" text-anchor="middle" opacity="0.9">Pedia</text>

  <!-- Subtitle -->
  <text x="450" y="190" font-family="LibreBaskervilleItalic, LibreBaskerville, serif" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Compendium de règles pour la version 3.5</text>

  <!-- Decorative bottom line -->
  <line x1="100" y1="205" x2="800" y2="205" stroke="#8b5e3c" stroke-width="1" opacity="0.5"/>
</svg>

