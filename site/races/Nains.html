<script type="text/javascript">
    let raceDisplay = document.querySelector('race-display');
    raceDisplay.setData({
  "name": {
    "fr": "Manuel du Joueur",
    "en": "Player Handbook"
  }
}
, {
	"name": {
		"en": "Dwarves",
		"fr": "Nains"
	},
	"lore": {
		"en": [
			{ "content": "Dwarves are known for their skill in warfare, their ability to withstand physical and magical punishment, their knowledge of the earth’s secrets, their hard work, and their capacity for drinking ale. Their mysterious kingdoms, carved out from the insides of mountains, are renowned for the marvelous treasures that they produce as gifts or for trade." },
			{ "title": "Personality", "content": "Dwarves are slow to laugh or jest and suspicious of strangers, but they are generous to those few who earn their trust. Dwarves value gold, gems, jewelry, and art objects made with these precious materials, and they have been known to succumb to greed. They fight neither recklessly nor timidly, but with careful courage and tenacity. Their sense of justice is strong, but at its worst it can turn into a thirst for vengeance. Among gnomes, who get along famously with dwarves, a mild oath is 'If I’m lying, may I cross a dwarf.'" },
			{ "title": "Physical Description", "content": "Dwarves stand only 4 to 4-1/2 feet tall, but they are so broad and compact that they are, on average, almost as heavy as humans. Dwarf men are slightly taller and noticeably heavier than dwarf women. Dwarves’ skin is typically deep tan or light brown, and their eyes are dark. Their hair is usually black, gray, or brown, and worn long. Dwarf men value their beards highly and groom them very carefully. Dwarves favor simple styles for their hair, beards, and clothes. Dwarves are considered adults at about age 40, and they can live to be more than 400 years old." },
			{ "title": "Relations", "content": "Dwarves get along fine with gnomes, and passably with humans, half-elves, and halflings. Dwarves say, “The difference between an acquaintance and a friend is about a hundred years.” Humans, with their short life spans, have a hard time forging truly strong bonds with dwarves. The best dwarf–human friendship is often between a human and a dwarf who liked the human’s parents and grandparents. Dwarves fail to appreciate elves’ subtlety and art, regarding elves as unpredictable, fickle, and flighty. Still, elves and dwarves have, through the ages, found common cause in battles against orcs, goblins, and gnolls. Through many such joint campaigns, the elves have earned the dwarves’ grudging respect. Dwarves mistrust half-orcs in general, and the feeling is mutual. Luckily, dwarves are fair-minded, and they grant individual half-orcs the opportunity to prove themselves." },
			{ "title": "Alignment", "content": "Dwarves are usually lawful, and they tend toward good. Adventuring dwarves are less likely to fit the common mold, however, since they’re more likely to be those who did not fit perfectly into dwarven society." },
			{ "title": "Dwarven Lands", "content": "Dwarven kingdoms usually lie deep beneath the stony faces of mountains, where the dwarves mine gems and precious metals and forge items of wonder. Trustworthy members of other races are welcome in such settlements, though some parts of these lands are off limits even to them. Whatever wealth the dwarves can’t find in their mountains, they gain through trade. Dwarves dislike water travel, so enterprising humans frequently handle trade in dwarven goods when travel is along a water route. Dwarves in human lands are typically mercenaries, weaponsmiths, armorsmiths, jewelers, and artisans. Dwarf bodyguards are renowned for their courage and loyalty, and they are well rewarded for their virtues." },
			{ "title": "Religion", "content": "The chief deity of the dwarves is Moradin, the Soul Forger. He is the creator of the dwarves, and he expects his followers to work for the betterment of the dwarf race." },
			{ "title": "Language", "content": "Dwarves speak Dwarven, which has its own runic script. Dwarven literature is marked by comprehensive histories of kingdoms and wars through the millennia. The Dwarven alphabet is also used (with minor variations) for the Gnome, Giant, Goblin, Orc, and Terran languages. Dwarves often speak the languages of their friends (humains and gnomes) and enemies. Some also learn Terran, the strange language of earth-based creatures such as xorns." },
			{ "title": "Names", "content": "A dwarf’s name is granted to him by his clan elder, in accordance with tradition. Every proper dwarven name has been used and reused down through the generations. A dwarf’s name is not his own. It belongs to his clan. If he misuses it or brings shame to it, his clan will strip him of it. A dwarf stripped of his name is forbidden by dwarven law to use any dwarven name in its place." },
			{ "title": "Adventurers", "content": "A dwarf adventurer may be motivated by crusading zeal, a love of excitement, or simple greed. As long as his accomplishments bring honor to his clan, his deeds earn him respect and status. Defeating giants and claiming powerful magic weapons are sure ways for a dwarf to earn the respect of other dwarves." }
		],
		"fr": [
			{ "content": "Les nains sont réputés pour leur habileté au combat, leur capacité à résister aux épreuves physiques et magiques, leur connaissance des secrets de la terre, leur travail acharné et leur talent pour boire de la bière. Leurs royaumes mystérieux, creusés à l’intérieur des montagnes, sont célèbres pour les trésors merveilleux qu’ils produisent, que ce soit en cadeau ou pour le commerce." },
			{ "title": "Personnalité", "content": "Les nains sont lents à rire ou à plaisanter et se méfient des étrangers, mais ils sont généreux envers les rares personnes qui gagnent leur confiance. Ils accordent une grande valeur à l’or, aux gemmes, aux bijoux et aux objets d’art fabriqués avec ces matériaux précieux, et peuvent parfois succomber à l’avidité. Ils ne combattent ni avec imprudence ni avec timidité, mais avec un courage et une ténacité réfléchis. Leur sens de la justice est fort, mais il peut parfois se transformer en soif de vengeance. Parmi les gnomes, qui s’entendent très bien avec les nains, un serment léger est : « Si je mens, puisse-je croiser un nain. »" },
			{ "title": "Description physique", "content": "Les nains ne mesurent que 1,20 à 1,40 mètre, mais leur carrure large et compacte fait qu’ils pèsent presque autant qu’un humain. Les hommes nains sont légèrement plus grands et nettement plus lourds que les femmes naines. Leur peau est généralement d’un brun profond ou clair, et leurs yeux sont sombres. Leurs cheveux, souvent noirs, gris ou bruns, sont portés longs. Les hommes nains accordent une grande importance à leur barbe et en prennent soin avec minutie. Les nains préfèrent des styles simples pour leurs cheveux, leurs barbes et leurs vêtements. Ils sont considérés comme adultes vers l’âge de 40 ans et peuvent vivre plus de 400 ans." },
			{ "title": "Relations", "content": "Les nains s’entendent bien avec les gnomes et assez bien avec les humains, les demi-elfes et les halfelins. Ils disent : « La différence entre une connaissance et un ami, c’est une centaine d’années. » Les humains, avec leur courte espérance de vie, ont du mal à nouer des liens vraiment forts avec les nains. La meilleure amitié entre un humain et un nain est souvent celle d’un humain et d’un nain qui appréciait les parents et grands-parents de cet humain. Les nains n’apprécient pas la subtilité et l’art des elfes, qu’ils considèrent comme imprévisibles, capricieux et légers. Pourtant, au fil des siècles, elfes et nains ont souvent uni leurs forces pour combattre les orques, les gobelins et les gnolls. Grâce à ces nombreuses campagnes communes, les elfes ont gagné le respect réticent des nains. Les nains se méfient généralement des demi-orques, et la réciproque est vraie. Heureusement, les nains sont équitables et offrent à chaque demi-orque la possibilité de prouver sa valeur." },
			{ "title": "Alignement", "content": "Les nains sont généralement loyaux et penchent vers le bien. Cependant, les nains aventuriers sont moins susceptibles de correspondre à ce moule, car ils sont souvent ceux qui ne s’intégraient pas parfaitement à la société naine." },
			{ "title": "Terres naines", "content": "Les royaumes nains se trouvent généralement profondément sous les faces rocheuses des montagnes, où les nains extraient des gemmes et des métaux précieux et forgent des objets merveilleux. Les membres dignes de confiance des autres races y sont les bienvenus, bien que certaines parties de ces terres leur soient interdites. Toute richesse que les nains ne trouvent pas dans leurs montagnes, ils l’obtiennent par le commerce. N’aimant pas voyager sur l’eau, ils laissent souvent aux humains entreprenants le soin de transporter leurs marchandises par voie fluviale. Dans les terres humaines, les nains sont généralement mercenaires, forgerons, armuriers, joailliers et artisans. Les gardes du corps nains sont réputés pour leur courage et leur loyauté, et sont bien récompensés pour ces qualités." },
			{ "title": "Religion", "content": "La divinité principale des nains est Moradin, le Forge-Âme. Il est le créateur des nains et attend de ses fidèles qu’ils œuvrent pour l’amélioration de la race naine." },
			{ "title": "Langue", "content": "Les nains parlent le nain, qui possède son propre alphabet runique. La littérature naine est marquée par des histoires complètes de royaumes et de guerres à travers les millénaires. L’alphabet nain est également utilisé (avec de légères variations) pour les langues gnome, géante, gobeline, orque et terrane. Les nains parlent souvent les langues de leurs amis (humains et gnomes) et de leurs ennemis. Certains apprennent aussi le terran, la langue étrange des créatures terrestres comme les xorns." },
			{ "title": "Noms", "content": "Le nom d’un nain lui est accordé par l’aîné de son clan, selon la tradition. Chaque nom nain a été utilisé et réutilisé à travers les générations. Le nom d’un nain ne lui appartient pas : il appartient à son clan. S’il en abuse ou le déshonore, son clan le lui retirera. Un nain privé de son nom est interdit par la loi naine d’utiliser un autre nom nain à sa place." },
			{ "title": "Aventuriers", "content": "Un nain aventurier peut être motivé par un zèle de croisade, un amour de l’excitation ou une simple avidité. Tant que ses accomplissements apportent de l’honneur à son clan, ses actions lui valent respect et statut. Vaincre des géants et s’emparer d’armes magiques puissantes sont des moyens sûrs pour un nain de gagner le respect des autres nains." }
		]
	},
	"racial-features": {
		"en": [
			{ "content": "+2 Constitution, –2 Charisma: Dwarves are stout and tough but tend to be gruff and reserved."},
			{ "content": "Medium: As Medium creatures, dwarves have no special bonuses or penalties due to their size."},
			{ "content": "Dwarf base land speed is 20 feet. However, dwarves can move at this speed even when wearing medium or heavy armor or when carrying a medium or heavy load (unlike other creatures, whose speed is reduced in such situations)."},
			{ "content": "Darkvision: Dwarves can see in the dark up to 60 feet. Darkvision is black and white only, but it is otherwise like normal sight, and dwarves can function just fine with no light at all."},
			{ "content": "Stonecunning: This ability grants a dwarf a +2 racial bonus on Search checks to notice unusual stonework, such as sliding walls, stonework traps, new construction (even when built to match the old), unsafe stone surfaces, shaky stone ceilings, and the like. Something that isn’t stone but that is disguised as stone also counts as unusual stonework. A dwarf who merely comes within 10 feet of unusual stonework can make a Search check as if he were actively searching, and a dwarf can use the Search skill to find stonework traps as a rogue can. A dwarf can also intuit depth, sensing his approximate depth underground as naturally as a human can sense which way is up. Dwarves have a sixth sense about stonework, an innate ability that they get plenty of opportunity to practice and hone in their underground homes."},
			{ "content": "Weapon Familiarity: Dwarves may treat dwarven waraxes and dwarven urgroshes as martial weapons, rather than exotic weapons."},
			{ "content": "Stability: Dwarves are exceptionally stable on their feet. A dwarf gains a +4 bonus on ability checks made to resist being bull rushed or tripped when standing on the ground (but not when climbing, flying, riding, or otherwise not standing firmly on the ground)."},
			{ "content": "+2 racial bonus on saving throws against poison: Dwarves are hardy and resistant to toxins."},
			{ "content": "+2 racial bonus on saving throws against spells and spell-like effects: Dwarves have an innate resistance to magic spells."},
			{ "content": "+1 racial bonus on attack rolls against orcs (including half-orcs) and goblinoids (including goblins, hobgoblins, and bugbears): Dwarves are trained in the special combat techniques that allow them to fight their common enemies more effectively."},
			{ "content": "+4 dodge bonus to Armor Class against monsters of the giant type (such as ogres, trolls, and hill giants): This bonus represents special training that dwarves undergo, during which they learn tricks that previous generations developed in their battles with giants. Any time a creature loses its Dexterity bonus (if any) to Armor Class, such as when it’s caught flat-footed, it loses its dodge bonus, too."},
			{ "content": "+2 racial bonus on Appraise checks that are related to stone or metal items: Dwarves are familiar with valuable items of all kinds, especially those made of stone or metal."},
			{ "content": "+2 racial bonus on Craft checks that are related to stone or metal: Dwarves are especially capable with stonework and metalwork."},
			{ "content": "Automatic Languages: Common and Dwarven. Bonus Languages: Giant, Gnome, Goblin, Orc, Terran, and Undercommon. Dwarves are familiar with the languages of their enemies and of their subterranean allies."},
			{ "content": "Favored Class: Fighter. A multiclass dwarf’s fighter class does not count when determining whether he takes an experience point penalty for multiclassing. Dwarven culture extols the virtues of battle, and the vocation comes easily to dwarves."}
		],
		"fr": [
			{ "content": "+2 Constitution, –2 Charisme : Les nains sont robustes et endurants, mais ont tendance à être bourrus et réservés." },
			{ "content": "Taille moyenne : En tant que créatures de taille Moyenne, les nains n’ont ni bonus ni malus particuliers liés à leur taille." },
			{ "content": "Vitesse de déplacement de base : 6 mètres (20 pieds). Cependant, les nains peuvent se déplacer à cette vitesse même en portant une armure moyenne ou lourde, ou en transportant une charge moyenne ou lourde (contrairement aux autres créatures, dont la vitesse est réduite dans ces situations)." },
			{ "content": "Vision dans le noir : Les nains voient dans le noir jusqu’à 18 mètres. Cette vision est en noir et blanc, mais fonctionne sinon comme une vision normale, et les nains peuvent se déplacer sans problème dans l’obscurité totale." },
			{ "content": "Sens de la pierre : Cette capacité accorde aux nains un bonus racial de +2 aux tests de Fouille pour repérer des ouvrages en pierre inhabituels, comme des murs coulissants, des pièges en pierre, des constructions récentes (même conçues pour imiter l’ancien), des surfaces en pierre instables, des plafonds en pierre branlants, etc. Tout ce qui n’est pas en pierre mais déguisé en pierre compte aussi comme un ouvrage en pierre inhabituel. Un nain qui s’approche à moins de 3 mètres d’un ouvrage en pierre inhabituel peut effectuer un test de Fouille comme s’il cherchait activement, et un nain peut utiliser la compétence Fouille pour trouver des pièges en pierre comme un rôdeur. Un nain peut aussi intuiter la profondeur, sentant sa profondeur approximative sous terre aussi naturellement qu’un humain sent où est le haut. Les nains ont un sixième sens pour la pierre, une capacité innée qu’ils ont de nombreuses occasions de pratiquer et d’affiner dans leurs foyers souterrains." },
			{ "content": "Maîtrise des armes : Les nains peuvent traiter les haches de guerre naines et les urgroshes nains comme des armes de guerre plutôt que des armes exotiques." },
			{ "content": "Stabilité : Les nains sont exceptionnellement stables sur leurs pieds. Un nain obtient un bonus de +4 aux tests de caractéristique pour résister à une bousculade ou à une tentative de faire trébucher lorsqu’il est debout sur le sol (mais pas lorsqu’il grimpe, vole, monte ou n’est pas fermement debout sur le sol)." },
			{ "content": "Bonus racial de +2 aux jets de sauvegarde contre le poison : Les nains sont robustes et résistants aux toxines." },
			{ "content": "Bonus racial de +2 aux jets de sauvegarde contre les sorts et effets similaires à des sorts : Les nains ont une résistance innée à la magie." },
			{ "content": "Bonus racial de +1 aux jets d’attaque contre les orques (y compris les demi-orques) et les gobeloïdes (y compris les gobelins, les hobgobelins et les boggards) : Les nains sont formés à des techniques de combat spéciales qui leur permettent de combattre leurs ennemis communs plus efficacement." },
			{ "content": "Bonus d’esquive de +4 à la Classe d’Armure contre les monstres de type géant (comme les ogres, les trolls et les géants des collines) : Ce bonus représente un entraînement spécial que les nains suivent, au cours duquel ils apprennent des astuces développées par les générations précédentes dans leurs batailles contre les géants. Chaque fois qu’une créature perd son bonus de Dextérité (s’il en a un) à la Classe d’Armure, comme lorsqu’elle est surprise, elle perd aussi son bonus d’esquive." },
			{ "content": "Bonus racial de +2 aux tests d’Évaluation liés aux objets en pierre ou en métal : Les nains sont familiers avec les objets de valeur de toutes sortes, en particulier ceux fabriqués en pierre ou en métal." },
			{ "content": "Bonus racial de +2 aux tests d’Artisanat liés à la pierre ou au métal : Les nains sont particulièrement compétents dans le travail de la pierre et du métal." },
			{ "content": "Langues automatiques : le Commun et le Nain. Langues bonus : Géant, Gnome, Gobelin, Orque, Terran et Commun des profondeurs. Les nains connaissent les langues de leurs ennemis et de leurs alliés souterrains." },
			{ "content": "Classe de prédilection : Guerrier. La classe de guerrier d’un nain multiclassé ne compte pas pour déterminer s’il subit une pénalité d’expérience pour le multiclassage. La culture naine exalte les vertus du combat, et cette vocation vient naturellement aux nains." }
		]
	}
});
</script>
