<script type="text/javascript">
    let raceDisplay = document.querySelector('race-display');
    raceDisplay.setData({
  "name": {
    "fr": "Manuel du Joueur",
    "en": "Player Handbook"
  }
}
, {
	"name": {
		"en": "Half-Elves",
		"fr": "Demi-elfes"
	},
	"lore": {
		"en": [
			{ "content": "Humans and elves sometimes wed, the elf attracted to the human’s energy and the human to the elf’s grace. These marriages end quickly as elves count years because a human’s life is so brief, but they leave an enduring legacy—half-elf children. The life of a half-elf can be hard. If raised by elves, the half-elf seems to grow with astounding speed, reaching maturity within two decades. The half-elf becomes an adult long before she has had time to learn the intricacies of elven art and culture, or even grammar. She leaves behind her childhood friends, becoming physically an adult but culturally still a child by elven standards. Typically, she leaves her elven home, which is no longer familiar, and finds her way among humans. If, on the other hand, she is raised by humans, the half-elf finds herself different from her peers: more aloof, more sensitive, less ambitious, and slower to mature. Some half-elves try to fit in among humans, while others find their identities in their differences. Most find places for themselves in human lands, but some feel like outsiders all their lives." },
			{ "title": "Personality", "content": "Most half-elves have the curiosity, inventiveness, and ambition of the human parent, along with the refined senses, love of nature, and artistic tastes of the elf parent." },
			{ "title": "Physical Description", "content": "To humans, half-elves look like elves. To elves, they look like humans—indeed, elves call them half-humans. Half-elf height ranges from under 5 feet to about 6 feet tall, and weight usually ranges from 100 to 180 pounds. Half-elf men are taller and heavier than half-elf women, but the difference is less pronounced than that found among humans. Half-elves are paler, fairer, and smoother-skinned than their human parents, but their actual skin tone, hair color, and other details vary just as human features do. Half-elves’ eyes are green, just as are those of their elf parents. A half-elf reaches adulthood at age 20 and can live to be more than 180 years old. Most half-elves are the children of human–elf pairings. Some, however, are the children of parents who themselves are partly human and partly elf. Some of these 'second generation' half-elves have humanlike eyes, but most still have green eyes." },
			{ "title": "Relations", "content": "Half-elves do well among both elves and humans, and they also get along well with dwarves, gnomes, and halflings. They have elven grace without elven aloofness and human energy without human boorishness. They make excellent ambassadors and go-betweens (except between elves and humans, since each side suspects the half-elf of favoring the other). In human lands where elves are distant or not on friendly terms with other races, however, half-elves are viewed with suspicion. Some half-elves show a marked disfavor toward half-orcs. Perhaps the similarity between themselves and half-orcs (a partly human lineage) makes these half-elves uncomfortable." },
			{ "title": "Alignment", "content": "Half-elves share the chaotic bent of their elven heritage, but, like humans, they tend toward both good and evil in equal proportion. Like elves, they value personal freedom and creative expression, demonstrating neither love of leaders nor desire for followers. They chafe at rules, resent others’ demands, and sometimes prove unreliable, or at least unpredictable." },
			{ "title": "Half-Elven Lands", "content": "Half-elves have no lands of their own, though they are welcome in human cities and elven forests. In large cities, half-elves sometimes form small communities of their own." },
			{ "title": "Religion", "content": "Half-elves raised among elves follow elven deities, principally Corellon Larethian (god of the elves). Those raised among humans often follow Ehlonna (goddess of the woodlands)." },
			{ "title": "Language", "content": "Half-elves speak the languages they are born to, Common and Elven. Half-elves are slightly clumsy with the intricate Elven language, though only elves notice, and even so half-elves do better than non-elves." },
			{ "title": "Names", "content": "Half-elves use either human or elven naming conventions. Ironically, a half-elf raised among humans is often given an elven name in honor of her heritage, just as a half-elf raised among elves often takes a human name." },
			{ "title": "Adventurers", "content": "Half-elves find themselves drawn to strange careers and unusual company. Taking up the life of an adventurer comes easily to many of them. Like elves, they are driven by wanderlust." }
		],
		"fr": [
			{ "content": "Les humains et les elfes s’unissent parfois, l’elfe attiré par l’énergie de l’humain et l’humain par la grâce de l’elfe. Ces mariages se terminent rapidement au regard de la longévité elfique, car la vie d’un humain est si brève, mais ils laissent un héritage durable : des enfants demi-elfes. La vie d’un demi-elfe peut être difficile. S’il est élevé par des elfes, il semble grandir à une vitesse surprenante, atteignant la maturité en seulement deux décennies. Le demi-elfe devient adulte bien avant d’avoir eu le temps d’apprendre les subtilités de l’art et de la culture elfiques, voire même de la grammaire. Il laisse derrière lui ses amis d’enfance, devenant physiquement adulte mais restant culturellement un enfant selon les normes elfiques. Typiquement, il quitte son foyer elfe, qui ne lui est plus familier, et trouve sa place parmi les humains. À l’inverse, s’il est élevé par des humains, le demi-elfe se sent différent de ses pairs : plus distant, plus sensible, moins ambitieux et plus lent à mûrir. Certains demi-elfes tentent de s’intégrer parmi les humains, tandis que d’autres trouvent leur identité dans leurs différences. La plupart se font une place dans les terres humaines, mais certains se sentent comme des étrangers toute leur vie." },
			{ "title": "Personnalité", "content": "La plupart des demi-elfes ont la curiosité, l’inventivité et l’ambition de leur parent humain, ainsi que les sens raffinés, l’amour de la nature et le goût artistique de leur parent elfe." },
			{ "title": "Description physique", "content": "Aux yeux des humains, les demi-elfes ressemblent à des elfes. Pour les elfes, ils ressemblent à des humains — en fait, les elfes les appellent des demi-humains. La taille des demi-elfes varie de moins de 1,50 mètre à environ 1,80 mètre, et leur poids se situe généralement entre 45 et 80 kilogrammes. Les hommes demi-elfes sont plus grands et plus lourds que les femmes demi-elfes, mais la différence est moins marquée que chez les humains. Les demi-elfes ont la peau plus pâle, plus claire et plus lisse que leurs parents humains, mais leur teint, leur couleur de cheveux et autres détails varient autant que les traits humains. Les yeux des demi-elfes sont verts, tout comme ceux de leurs parents elfes. Un demi-elfe atteint l’âge adulte à 20 ans et peut vivre plus de 180 ans. La plupart des demi-elfes sont les enfants d’unions entre humains et elfes. Certains, cependant, sont les enfants de parents eux-mêmes partiellement humains et partiellement elfes. Parmi ces demi-elfes de 'deuxième génération', certains ont des yeux semblables à ceux des humains, mais la plupart conservent des yeux verts." },
			{ "title": "Relations", "content": "Les demi-elfes s’intègrent bien parmi les elfes et les humains, et s’entendent également avec les nains, les gnomes et les halfelins. Ils possèdent la grâce elfique sans l’éloignement des elfes, et l’énergie humaine sans la grossièreté des humains. Ils font d’excellents ambassadeurs et intermédiaires (sauf entre elfes et humains, car chaque camp suspecte le demi-elfe de favoriser l’autre). Dans les terres humaines où les elfes sont distants ou en mauvais termes avec les autres races, les demi-elfes sont cependant regardés avec méfiance. Certains demi-elfes montrent une aversion marquée envers les demi-orques. Peut-être que la similitude entre eux et les demi-orques (une lignée partiellement humaine) rend ces demi-elfes mal à l’aise." },
			{ "title": "Alignement", "content": "Les demi-elfes partagent la tendance chaotique de leur héritage elfe, mais, comme les humains, ils penchent autant vers le bien que vers le mal. Comme les elfes, ils valorisent la liberté personnelle et l’expression créative, ne montrant ni amour pour les dirigeants ni désir de disciples. Ils se rebellent contre les règles, supportent mal les exigences des autres et se révèlent parfois peu fiables, ou du moins imprévisibles." },
			{ "title": "Terres des demi-elfes", "content": "Les demi-elfes n’ont pas de terres qui leur soient propres, bien qu’ils soient les bienvenus dans les cités humaines et les forêts elfiques. Dans les grandes villes, les demi-elfes forment parfois de petites communautés à eux." },
			{ "title": "Religion", "content": "Les demi-elfes élevés parmi les elfes suivent les divinités elfiques, principalement Corellon Larethian (le dieu des elfes). Ceux élevés parmi les humains vénèrent souvent Ehlonna (la déesse des bois)." },
			{ "title": "Langue", "content": "Les demi-elfes parlent les langues qu’ils ont apprises dès la naissance, le Commun et l’Elfe. Ils sont légèrement maladroits avec la langue elfique complexe, bien que seuls les elfes le remarquent, et même ainsi, ils s’en sortent mieux que les non-elfes." },
			{ "title": "Noms", "content": "Les demi-elfes utilisent soit les conventions de nommage humaines, soit elfiques. Ironiquement, un demi-elfe élevé parmi les humains se voit souvent donner un nom elfe en l’honneur de son héritage, tout comme un demi-elfe élevé parmi les elfes prend souvent un nom humain." },
			{ "title": "Aventuriers", "content": "Les demi-elfes se sentent attirés par des carrières étranges et des compagnies inhabituelles. Se lancer dans la vie d’aventurier vient naturellement à beaucoup d’entre eux. Comme les elfes, ils sont poussés par le désir d’évasion." }
		]
	},
	"racial-features": {
		"en": [
			{ "content": "Medium: As Medium creatures, half-elves have no special bonuses or penalties due to their size." },
			{ "content": "Half-elf base land speed is 30 feet." },
			{ "content": "Immunity to sleep spells and similar magical effects, and a +2 racial bonus on saving throws against enchantment spells or effects." },
			{ "content": "Low-Light Vision: A half-elf can see twice as far as a human in starlight, moonlight, torchlight, and similar conditions of poor illumination. She retains the ability to distinguish color and detail under these conditions." },
			{ "content": "+1 racial bonus on Listen, Search, and Spot checks: A half-elf does not have the elf’s ability to notice secret doors simply by passing near them. Half-elves have keen senses, but not as keen as those of an elf." },
			{ "content": "+2 racial bonus on Diplomacy and Gather Information checks: Half-elves get along naturally with all people." },
			{ "content": "Elven Blood: For all effects related to race, a half-elf is considered an elf. Half-elves, for example, are just as vulnerable to special effects that affect elves as their elf ancestors are, and they can use magic items that are only usable by elves." },
			{ "content": "Automatic Languages: Common and Elven. Bonus Languages: Any (other than secret languages, such as Druidic). Half-elves have all the versatility and broad (if shallow) experience that humans have." },
			{ "content": "Favored Class: Any. When determining whether a multiclass half-elf takes an experience point penalty, her highest-level class does not count." }
		],
		"fr": [
			{ "content": "Taille moyenne : En tant que créatures de taille Moyenne, les demi-elfes n’ont ni bonus ni malus particuliers liés à leur taille." },
			{ "content": "Vitesse de déplacement de base : 9 mètres (30 pieds)." },
			{ "content": "Immunité aux sorts de sommeil et aux effets magiques similaires, et un bonus racial de +2 aux jets de sauvegarde contre les sorts et effets d’enchantement." },
			{ "content": "Vision dans la pénombre : Un demi-elfe peut voir deux fois plus loin qu’un humain dans des conditions de faible luminosité, comme la lumière des étoiles, de la lune ou des torches. Il conserve la capacité de distinguer les couleurs et les détails dans ces conditions." },
			{ "content": "Bonus racial de +1 aux jets de Perception auditive, de Fouille et de Perception : Un demi-elfe ne possède pas la capacité elfique de remarquer les portes secrètes simplement en passant à proximité. Les demi-elfes ont des sens aiguisés, mais pas autant que ceux d’un elfe." },
			{ "content": "Bonus racial de +2 aux tests de Diplomatie et de Renseignement : Les demi-elfes s’entendent naturellement avec tout le monde." },
			{ "content": "Sang elfe : Pour tous les effets liés à la race, un demi-elfe est considéré comme un elfe. Les demi-elfes, par exemple, sont tout aussi vulnérables aux effets spéciaux affectant les elfes que leurs ancêtres elfes, et ils peuvent utiliser des objets magiques réservés aux elfes." },
			{ "content": "Langues automatiques : le Commun et l’Elfe. Langues bonus : n’importe quelle langue (à l’exception des langues secrètes, comme le Druidique). Les demi-elfes ont toute la polyvalence et l’expérience variée (bien que superficielle) des humains." },
			{ "content": "Classe de prédilection : Aucune. Lorsqu’on détermine si un demi-elfe multiclassé subit une pénalité d’expérience, sa classe de plus haut niveau ne compte pas." }
		]
	}
});
</script>
