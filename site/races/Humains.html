<script type="text/javascript">
    let raceDisplay = document.querySelector('race-display');
    raceDisplay.setData({
  "name": {
    "fr": "Manuel du Joueur",
    "en": "Player Handbook"
  }
}
, {
	"name": {
		"fr": "Humains",
		"en": "Humans"
	},
	"lore": {
		"en": [
			{ "content": "Most humans are the descendants of pioneers, conquerors, traders, travelers, refugees, and other people on the move. As a result, human lands are home to a mix of people—physically, culturally, religiously, and politically different. Hardy or fine, light-skinned or dark, showy or austere, primitive or civilized, devout or impious, humans run the gamut." },
			{ "title": "Personality", "content": "Humans are the most adaptable, flexible, and ambitious people among the common races. They are diverse in their tastes, morals, customs, and habits. Others accuse them of having little respect for history, but it’s only natural that humans, with their relatively short life spans and constantly changing cultures, would have a shorter collective memory than dwarves, elves, gnomes, or halflings" },
			{ "title": "Physical Description", "content": "Humans typically stand from 5 feet to a little over 6 feet tall and weigh from 125 to 250 pounds, with men noticeably taller and heavier than women. Thanks to their penchant for migration and conquest, and to their short life spans, humans are more physically diverse than other common races. Their skin shades range from nearly black to very pale, their hair from black to blond (curly, kinky, or straight), and their facial hair (for men) from sparse to thick. Plenty of humans have a dash of nonhuman blood, and they may demonstrate hints of elf, orc, or other lineages. Members of this race are often ostentatious or unorthodox in their grooming and dress, sporting unusual hairstyles, fanciful clothes, tattoos, body piercings, and the like. Humans have short life spans, reaching adulthood at about age 15 and rarely living even a single century" },
			{ "title": "Relations", "content": "Just as readily as they mix with each other, humans mix with members of other races, among which they are known as “everyone’s second-best friends.” Humans serve as ambassadors, diplomats, magistrates, merchants, and functionaries of all kinds" },
			{ "title": "Alignment", "content": "Humans tend toward no particular alignment, not even neutrality. The best and the worst are found among them" },
			{ "title": "Human Lands", "content": "Human lands are usually in flux, with new ideas, social changes, innovations, and new leaders constantly coming to the fore. Members of longer-lived races find human culture exciting but eventually a little wearying or even bewildering. Since humans lead such short lives, their leaders are all young compared to the political, religious, and military leaders among the other races. Even where individual humans are conservative traditionalists, human institutions change with the generations, adapting and evolving faster than parallel institutions among the elves, dwarves, gnomes, and halflings. Individually and as a group, humans are adaptable opportunists, and they stay on top of changing political dynamics. Human lands generally include relatively large numbers of nonhumans (compared, for instance, to the number of nondwarves who live in dwarven lands)." },
			{ "title": "Religion", "content": "Unlike members of the other common races, humans do not have a chief racial deity. Pelor, the sun god, is the most commonly worshiped deity in human lands, but he can claim nothing like the central place that the dwarves give Moradin or the elves give Corellon Larethian in their respective pantheons. Some humans are the most ardent and zealous adherents of a given religion, while others are the most impious people around." },
			{ "title": "Language", "content": "Humans speak Common. They typically learn other languages as well, including obscure ones, and they are fond of sprinkling their speech with words borrowed from other tongues: Orc curses, Elven musical expressions, Dwarven military phrases, and so on." },
			{ "title": "Names", "content": "Human names vary greatly. Without a unifying deity to give them a touchstone for their culture, and with such a fast breeding cycle, humans mutate socially at a fast rate. Human culture, therefore, is more diverse than other cultures, and no human names are truly typical. Some human parents give their children dwarven or elven names (pronounced more or less correctly)" },
			{ "title": "Adventurers", "content": "Human adventurers are the most audacious, daring, and ambitious members of an audacious, daring, and ambitious race. A human can earn glory in the eyes of her fellows by amassing power, wealth, and fame. Humans, more than other people, champion causes rather than territories or groups." }
		],
		"fr": [
			{ "content": "La plupart des humains descendent de pionniers, marchands, voyageurs, réfugiés et autres populations en constant mouvement, 1] en résulte une grande variété, tant au niveau du physique que de la culture, des croyances religieuses et du système politique. Frèles.ou forts, blancs ou noirs de peau, | extravertis ou renfermés, primitifs ou civilisés, dévots ou impies, toutes les tendances sont représentées au sein de la race humaine." },
			{ "title": "Personnalité", "content": " Parmi les races dominantes, les humains sont les plus ambitieux et ceux qui ont les plus grandes capacités d'adaptation. Chez eux, la diversité est la règle tant pour ce qui est des goûts que de la morale, des coutumes ou des habitudes. D'aucuns les accusent de n'avoir aucun respect | pour l'histoire, mais vivant bien moins vieux que les elfes, gnomes, halfelins et autres nains, il est naturel que les humains aient une mémoire collective plus limitée que celle des autres races." },
			{ "title": "Description", "content": "Les humains mesurent généralement de 1,50 mètre à un peu plus de 1,80 mètre et pèsent de 60 à 120 kilos, les hommes étant sensiblement plus grands et plus lourds que les femmes. Leur penchant pour les conquêtes et leur cycle de reproduction plus court que celui de la plupart des autres races expliquent leur extrême diversité d'apparence : leur peau va d'un blanc de lait à un noir d'ébène, leurs cheveux peuvent être noirs, châtains, blonds ou roux (raides, ondulés ou frisés) er la barbe des hommes est plus ou moins fournie selon le patrimoine génétique. Beaucoup ont du sang d'autres races dans les veines, et il n'est pas rare qu'ils aient quelques traits elfes ou d'orques, par exemple. Ils s’habillent souvent de manière ostentatoire, er certains complètent leur tenue d'une coiffure excentrique, de tatouages ou de piercings. Leur espérance de vie est limitée. Ils atteignent leur majorité à 15 ans et fêtent rarement leur siècle d'existence." },
			{ "title": "Relations avec les autres races", "content": "Les humains se mélent aussi aisément aux autres races qu'aux autres communautés humaines. Il en résulte que presque tous les humanoïdes les considèrent comme le « meilleur second choix possible » (après les membres de leur propre race, évidemment). Ils occupent souvent des postes d'ambassadeurs, diplomates, magistrats, marchands ou fonctionnaires." },
			{ "title": "Alignement", "content": " Les humains ne tendent vers aucun alignement en particulier, pas même la neutralité. Chez eux, le meilleur côtoie le pire." },
			{ "title": "Territoires", "content": "Les territoires occupés par les humains sont en perpétuel changement, en raison du renouvellement constant des idées, de La structure sociale et des dirigeants, Les membres des autres races trouvent la culture humaine fascinante, mais aussi déconcertante et épuisante. Comme l'espérance de vie des humuins est limitée, leurs chefs politiques, militaires ou religieux sont très jeunes comparés à ceux des autres races. Même si des conservateurs figent parfois la progression d'une société, les bouleversements reprennent systématiquement une ou deux générations plus tard, avec pour conséquence une évolution bien plus rapide de la société humaine comparée à celle des elfes, des nains, des gnomes ou des halfelins. Individuellement ou en groupe, les humains savent saisir La moindre occasion et s'adapter à tout changement, aussi radical soit-il. Il y a souvent beaucoup de non-humains en territoires humains (bien plus, par exemple, que de non-nains vivant chez les nains)." },
			{ "title": "Religion", "content": "Contrairement aux autres races, les humains n'ont pas de divinité principale. Pélor, dieu du Soleil, est le dieu le plus vénéré, mais il n'a pas la place de chef du panthéon dont Moradin bénéficie chez les nains, et Corellon Larethian chez les elfes. Certains humains sont parmi les plus grands fanatiques religieux qui soient, tandis que d'autres se disent athées." },
			{ "title": "Langue", "content": "Les humains parlent le commun, également appelé langue commune. Il n'est pas rare qu'ils maicrisent d'autres idiomes, et parfois même une ou deux langues mortes Ils aiment parsemer leurs phrases de mots empruntés à d'autres langages : jurons orques, expressions musicales elfiques, termes militaires nains, etc." },
			{ "title": "Noms", "content": "Les noms humains sont très variés. Sans dieu fédérateur pour leur donner une base commune et avec leur cycle de reproduction rapide, ils donnent naissance à des sociétés en évolution constante. Il en résulre que leur culrure esr bien plus diversifiée que celle des autres races et qu'il n'existe pas de noms typiques. Certains parents humains aiment donner un nom nain ou elfique à leur enfant (quant à savoir s'ils le prononcent correctement, c'est une autre histoire" },
			{ "title": "Aventuriers", "content": "Les aventuriers humains sont encore ambitieux que la moyenne. Certains révent de gloire, qu'ils peuvent gagner en amassant les richesses et en multipliant les exploits. Plus que n'importe quels autres humanoïdes, les humains sont capables de se battre pour une cause plurôt que pour un groupe ou un territoire." }
		]
	},
	"racial-features": {
		"en": [
			{ "content": "Medium: As Medium creatures, humans have no special bonuses or penalties due to their size." },
			{ "content": "Human base land speed is 30 feet" },
			{ "content": "1 extra feat at 1st level, because humans are quick to master specialized tasks and varied in their talents." },
			{ "content": "4 extra skill points at 1st level and 1 extra skill point at each additional level, since humans are versatile and capable" },
			{ "content": "Automatic Language: Common. Bonus Languages: Any (other than secret languages, such as Druidic). See other racial lists for common languages or the Speak Language skill for a more comprehensive list. Humans mingle with all kinds of other folk and thus can learn any language found in an area." },
			{ "content": "Favored Class: Any. When determining whether a multiclass human takes an experience point penalty, her highest-level class does not count." }
		],
		"fr": [
			{ "content": "Taille moyenne. En tant que créatures de taille M, les humains n'ont aucun bonus ou malus en rapport avec leur taille." },
			{ "content": "Leur vitesse de déplacement au sol de base est de 9 mètres." },
			{ "content": "1 don supplémentaire au niveau 1, car ce sont des touche-à-tout qui apprennent particulièrement vite." },
			{ "content": "4 points de compétence supplémentaires au niveau 1, et 1 point de compétence supplémentaire à chaque niveau par la suite, pour Les mêmes raisons (les 4 points de compétence additionnels du niveau 1 sonr ajoutés après multiplication, pas avant)" },
			{ "content": "Langues parlées : D'office: commun. Supplémentaires : au choix (à l'exception des langages secrets, tels que la langue des druides). Voir les autres races ou la compétence Langues pour connaître les idiomes les plus courants. Les humains se mêlant à la plupart des races, ils ont la possibilité d'apprendre la majorité des dialectes parlés dans la région qu'ils habitent." },
			{ "content": "Classe de prédilection : La classe la plus élevée d'un humain multiclassé n'est pas prise. en compte quand on détermine s'il subit ou non un malus de points d'expérience." }
		]
	}
}
);
</script>
