<script type="text/javascript">
    let raceDisplay = document.querySelector('race-display');
    raceDisplay.setData({
  "name": {
    "fr": "Manuel du Joueur",
    "en": "Player Handbook"
  }
}
, {
	"name": {
		"en": "Gnomes",
		"fr": "Gnomes"
	},
	"lore": {
		"en": [
			{ "content": "Gnomes are welcome everywhere as technicians, alchemists, and inventors. Despite the demand for their skills, most gnomes prefer to remain among their own kind, living in comfortable burrows beneath rolling, wooded hills where animals abound." },
			{ "title": "Personality", "content": "Gnomes adore animals, beautiful gems, and jokes of all kinds. Members of this race have a great sense of humor, and while they love puns, jokes, and games, they also relish tricks—the more intricate the better. They apply the same dedication to more practical arts, such as engineering, as they do to their pranks. Gnomes are inquisitive. They love to find things out by personal experience. At times they’re even reckless. Their curiosity makes them skilled engineers, since they are always trying new ways to build things. Sometimes a gnome pulls a prank just to see how the people involved will react." },
			{ "title": "Physical Description", "content": "Gnomes stand about 3 to 3-1/2 feet tall and weigh 40 to 45 pounds. Their skin ranges from dark tan to woody brown, their hair is fair, and their eyes can be any shade of blue. Gnome males prefer short, carefully trimmed beards. Gnomes generally wear leather or earth tones, and they decorate their clothes with intricate stitching or fine jewelry. Gnomes reach adulthood at about age 40, and they typically live about 350 years, though some can live almost 500 years." },
			{ "title": "Relations", "content": "Gnomes get along well with dwarves, who share their love of precious objects, their curiosity about mechanical devices, and their hatred of goblins and giants. They enjoy the company of halflings, especially those who are easygoing enough to put up with pranks and jests. Most gnomes are a little suspicious of the taller races—humans, elves, half-elves, and half-orcs—but they are rarely hostile or malicious." },
			{ "title": "Gnome Lands", "content": "Gnomes make their homes in hilly, wooded lands. They live underground but get more fresh air than dwarves do, enjoying the natural, living world on the surface whenever they can. Their homes are well hidden by both clever construction and illusions. Those who come to visit and are welcome are ushered into the bright, warm burrows. Those who are not welcome never find the burrows in the first place. Gnomes who settle in human lands are commonly gemcutters, mechanics, sages, or tutors. Some human families retain gnome tutors. During his life, a gnome tutor can teach several generations of a single human family." },
			{ "title": "Religion", "content": "The chief gnome god is Garl Glittergold, the Watchful Protector. His clerics teach that gnomes are to cherish and support their communities. Pranks are seen as ways to lighten spirits and to keep gnomes humble, not as ways for pranksters to triumph over those they trick." },
			{ "title": "Language", "content": "The Gnome language, which uses the Dwarven script, is renowned for its technical treatises and its catalogs of knowledge about the natural world. Human herbalists, naturalists, and engineers commonly learn Gnome in order to read the best books on their topics of study." },
			{ "title": "Names", "content": "Gnomes love names, and most have half a dozen or so. As a gnome grows up, his mother gives him a name, his father gives him a name, his clan elder gives him a name, his aunts and uncles give him names, and he gains nicknames from just about anyone. Gnome names are typically variants on the names of ancestors or distant relatives, though some are purely new inventions. When dealing with humans and others who are rather 'stuffy' about names, a gnome learns to act as if he has no more than three names: a personal name, a clan name, and a nickname. When deciding which of his several names to use among humans, a gnome generally chooses the one that’s the most fun to say. Gnome clan names are combinations of common Gnome words, and gnomes almost always translate them into Common when in human lands (or into Elven when in elven lands, and so on)." },
			{ "title": "Male Names", "content": "Boddynock, Dimble, Fonkin, Gimble, Glim, Gerbo, Jebeddo, Namfoodle, Roondar, Seebo, Zook." },
			{ "title": "Female Names", "content": "Bimpnottin, Caramip, Duvamil, Ellywick, Ellyjobell, Loopmottin, Mardnab, Roywyn, Shamil, Waywocket" },
			{ "title": "Clan Names", "content": "Beren, Daergel, Folkor, Garrick, Nackle, Murnig, Ningel, Raulnor, Scheppen, Turen." },
			{ "title": "Nicknames", "content": "Aleslosh, Ashhearth, Badger, Cloak, Doublelock, Filchbatter, Fnipper, Oneshoe, Sparklegem, Stumbleduck." },
			{ "title": "Adventurers", "content": "Gnomes are curious and impulsive. They may take up adventuring as a way to see the world or for the love of exploring. Lawful gnomes may adventure to set things right and to protect the innocent, demonstrating the same sense of duty toward society as a whole that gnomes generally exhibit toward their own enclaves. As lovers of gems and other fine items, some gnomes take to adventuring as a quick, if dangerous, path to wealth. Depending on his relations to his home clan, an adventuring gnome may be seen as a vagabond or even as something of a traitor (for abandoning clan responsibilities)." }
		],
		"fr": [
			{ "content": "Les gnomes sont les bienvenus partout en tant que techniciens, alchimistes et inventeurs. Malgré la demande pour leurs compétences, la plupart préfèrent rester parmi les leurs, vivant dans des terriers confortables sous des collines boisées et vallonnées où les animaux abondent." },
			{ "title": "Personnalité", "content": "Les gnomes adorent les animaux, les belles gemmes et les blagues de toutes sortes. Les membres de cette race ont un excellent sens de l’humour, et s’ils aiment les jeux de mots, les blagues et les jeux, ils apprécient aussi les farces — plus elles sont élaborées, mieux c’est. Ils appliquent la même dédication aux arts plus pratiques, comme l’ingénierie, qu’à leurs farces. Les gnomes sont curieux : ils aiment découvrir les choses par eux-mêmes. Parfois, ils sont même imprudents. Leur curiosité en fait des ingénieurs habiles, car ils essaient toujours de nouvelles façons de construire. Parfois, un gnome fait une farce simplement pour voir comment les gens impliqués réagiront." },
			{ "title": "Description physique", "content": "Les gnomes mesurent environ 90 cm à 1 mètre et pèsent entre 18 et 20 kg. Leur peau va du brun clair au brun bois, leurs cheveux sont clairs, et leurs yeux peuvent être de toutes les nuances de bleu. Les mâles gnomes préfèrent les barbes courtes et soigneusement taillées. Les gnomes portent généralement des vêtements en cuir ou aux tons terre, qu’ils décorent de broderies complexes ou de beaux bijoux. Ils atteignent l’âge adulte vers 40 ans et vivent généralement environ 350 ans, bien que certains puissent approcher les 500 ans." },
			{ "title": "Relations", "content": "Les gnomes s’entendent bien avec les nains, avec qui ils partagent leur amour des objets précieux, leur curiosité pour les mécanismes et leur haine des gobelins et des géants. Ils apprécient la compagnie des halfelins, surtout ceux qui sont assez détendus pour supporter leurs farces et leurs plaisanteries. La plupart des gnomes se méfient un peu des races plus grandes — humains, elfes, demi-elfes et demi-orques — mais ils sont rarement hostiles ou malveillants." },
			{ "title": "Terres gnomes", "content": "Les gnomes habitent dans des terres vallonnées et boisées. Ils vivent sous terre, mais profitent plus de l’air frais que les nains, appréciant le monde naturel en surface chaque fois qu’ils le peuvent. Leurs foyers sont bien cachés, tant par une construction astucieuse que par des illusions. Ceux qui sont invités à rendre visite sont accueillis dans des terriers lumineux et chaleureux. Ceux qui ne sont pas les bienvenus ne trouvent jamais les terriers. Les gnomes qui s’installent dans les terres humaines sont souvent tailleurs de gemmes, mécaniciens, sages ou précepteurs. Certaines familles humaines engagent des gnomes comme précepteurs. Au cours de sa vie, un précepteur gnome peut enseigner à plusieurs générations d’une même famille humaine." },
			{ "title": "Religion", "content": "Le dieu principal des gnomes est Garl Glittergold, le Protecteur Vigilant. Ses clercs enseignent que les gnomes doivent chérir et soutenir leurs communautés. Les farces sont considérées comme un moyen d’égayer les esprits et de garder les gnomes humbles, et non comme une façon pour les farceurs de triompher de ceux qu’ils trompent." },
			{ "title": "Langue", "content": "La langue gnome, qui utilise l’alphabet nain, est réputée pour ses traités techniques et ses catalogues de connaissances sur le monde naturel. Les herboristes, naturalistes et ingénieurs humains apprennent souvent le gnome pour pouvoir lire les meilleurs ouvrages sur leurs sujets d’étude." },
			{ "title": "Noms", "content": "Les gnomes adorent les noms, et la plupart en ont une demi-douzaine ou plus. En grandissant, un gnome reçoit un nom de sa mère, un de son père, un de l’aîné de son clan, et d’autres de ses oncles et tantes, sans compter les surnoms que lui donnent presque tous ceux qu’il croise. Les noms gnomes sont généralement des variantes des noms d’ancêtres ou de parents éloignés, bien que certains soient de pures inventions. Lorsqu’ils traitent avec des humains ou d’autres qui sont plutôt 'coincés' sur les noms, les gnomes apprennent à faire comme s’ils n’en avaient que trois : un prénom, un nom de clan et un surnom. Lorsqu’un gnome doit choisir lequel de ses nombreux noms utiliser parmi les humains, il opte généralement pour celui qui est le plus amusant à prononcer. Les noms de clan gnomes sont des combinaisons de mots gnomes courants, et les gnomes les traduisent presque toujours en commun lorsqu’ils sont dans les terres humaines (ou en elfique dans les terres elfiques, etc.)." },
			{ "title": "Noms masculins", "content": "Boddynock, Dimble, Fonkin, Gimble, Glim, Gerbo, Jebeddo, Namfoodle, Roondar, Seebo, Zook." },
			{ "title": "Noms féminins", "content": "Bimpnottin, Caramip, Duvamil, Ellywick, Ellyjobell, Loopmottin, Mardnab, Roywyn, Shamil, Waywocket." },
			{ "title": "Noms de clan", "content": "Beren, Daergel, Folkor, Garrick, Nackle, Murnig, Ningel, Raulnor, Scheppen, Turen." },
			{ "title": "Surnoms", "content": "Aleslosh, Ashhearth, Blaireau, Manteau, Doubleverrou, Filchebatterie, Fnipper, Unesandale, Gemmeétincelante, Canetonne." },
			{ "title": "Aventuriers", "content": "Les gnomes sont curieux et impulsifs. Ils peuvent se lancer dans l’aventure pour découvrir le monde ou par amour de l’exploration. Les gnomes loyaux peuvent aventurer pour rétablir l’ordre et protéger les innocents, démontrant le même sens du devoir envers la société dans son ensemble que celui qu’ils ont généralement envers leurs propres enclaves. Amateurs de gemmes et d’objets fins, certains gnomes se tournent vers l’aventure comme un moyen rapide, bien que dangereux, de s’enrichir. Selon ses relations avec son clan d’origine, un gnome aventurier peut être considéré comme un vagabond, voire comme un traître (pour avoir abandonné ses responsabilités claniques)." }
		]
	},
	"racial-features": {
		"en": [
			{ "content": "+2 Constitution, –2 Strength: Like dwarves, gnomes are tough, but they are small and therefore not as strong as larger humanoids." },
			{ "content": "Small: As a Small creature, a gnome gains a +1 size bonus to Armor Class, a +1 size bonus on attack rolls, and a +4 size bonus on Hide checks, but he uses smaller weapons than humans use, and his lifting and carrying limits are three-quarters of those of a Medium character." },
			{ "content": "Gnome base land speed is 20 feet." },
			{ "content": "Low-Light Vision: A gnome can see twice as far as a human in starlight, moonlight, torchlight, and similar conditions of poor illumination. He retains the ability to distinguish color and detail under these conditions." },
			{ "content": "Weapon Familiarity: Gnomes may treat gnome hooked hammers as martial weapons rather than exotic weapons." },
			{ "content": "+2 racial bonus on saving throws against illusions: Gnomes are innately familiar with illusions of all kinds." },
			{ "content": "Add +1 to the Difficulty Class for all saving throws against illusion spells cast by gnomes. Their innate familiarity with these effects make their illusions more difficult to see through. This adjustment stacks with those from similar effects, such as the Spell Focus feat." },
			{ "content": "+1 racial bonus on attack rolls against kobolds and goblinoids (including goblins, hobgoblins, and bugbears): Gnomes battle these creatures frequently and practice special techniques for fighting them." },
			{ "content": "+4 dodge bonus to Armor Class against monsters of the giant type (such as ogres, trolls, and hill giants): This bonus represents special training that gnomes undergo, during which they learn tricks that previous generations developed in their battles with giants. Any time a creature loses its Dexterity bonus (if any) to Armor Class, such as when it’s caught flat-footed, it loses its dodge bonus, too." },
			{ "content": "+2 racial bonus on Listen checks: Gnomes have keen ears." },
			{ "content": "+2 racial bonus on Craft (alchemy) checks: A gnome’s sensitive nose allows him to monitor alchemical processes by smell." },
			{ "content": "Automatic Languages: Common and Gnome. Bonus Languages: Draconic, Dwarven, Elven, Giant, Goblin, and Orc. Gnomes deal more with elves and dwarves than elves and dwarves deal with one another, and they learn the languages of their enemies (kobolds, giants, goblins, and orcs) as well. In addition, a gnome can speak with a burrowing mammal (a badger, fox, rabbit, or the like, see below). This ability is innate to gnomes. See the speak with animals spell description." },
			{ "content": "Spell-Like Abilities: 1/day—speak with animals (burrowing mammal only, duration 1 minute). A gnome with a Charisma score of at least 10 also has the following spell-like abilities: 1/day—dancing lights, ghost sound, prestidigitation. Caster level 1st; save DC 10 + gnome’s Cha modifier + spell level." },
			{ "content": "Favored Class: Bard. A multiclass gnome’s bard class does not count when determining whether he takes an experience point penalty." }
		],
		"fr": [
			{ "content": "+2 Constitution, –2 Force : Comme les nains, les gnomes sont robustes, mais leur petite taille les rend moins forts que les humanoïdes plus grands." },
			{ "content": "Petite taille : En tant que créature de taille Petite, un gnome obtient un bonus de taille de +1 à la Classe d’Armure, un bonus de taille de +1 aux jets d’attaque, et un bonus de taille de +4 aux tests de Cachette. Cependant, il utilise des armes plus petites que celles des humains, et ses limites de portage et de soulèvement sont les trois quarts de celles d’un personnage de taille Moyenne." },
			{ "content": "Vitesse de déplacement de base : 6 mètres (20 pieds)." },
			{ "content": "Vision dans la pénombre : Un gnome peut voir deux fois plus loin qu’un humain dans des conditions de faible luminosité, comme la lumière des étoiles, de la lune ou des torches. Il conserve la capacité de distinguer les couleurs et les détails dans ces conditions." },
			{ "content": "Maîtrise des armes : Les gnomes peuvent traiter les marteaux à crochet gnomes comme des armes de guerre plutôt que des armes exotiques." },
			{ "content": "Bonus racial de +2 aux jets de sauvegarde contre les illusions : Les gnomes sont naturellement familiers avec tous les types d’illusions." },
			{ "content": "Augmente de +1 la Classe de Difficulté de tous les jets de sauvegarde contre les sorts d’illusion lancés par des gnomes. Leur familiarité innée avec ces effets rend leurs illusions plus difficiles à percer. Ce bonus s’ajoute à ceux d’effets similaires, comme le don Spécialisation dans les sorts." },
			{ "content": "Bonus racial de +1 aux jets d’attaque contre les kobolds et les gobeloïdes (y compris les gobelins, les hobgobelins et les boggards) : Les gnomes combattent fréquemment ces créatures et pratiquent des techniques spéciales pour les affronter." },
			{ "content": "Bonus d’esquive de +4 à la Classe d’Armure contre les monstres de type géant (comme les ogres, les trolls et les géants des collines) : Ce bonus représente un entraînement spécial que les gnomes suivent, au cours duquel ils apprennent des astuces développées par les générations précédentes dans leurs batailles contre les géants. Chaque fois qu’une créature perd son bonus de Dextérité (s’il en a un) à la Classe d’Armure, comme lorsqu’elle est surprise, elle perd aussi son bonus d’esquive." },
			{ "content": "Bonus racial de +2 aux jets de Perception auditive : Les gnomes ont une ouïe fine." },
			{ "content": "Bonus racial de +2 aux tests d’Artisanat (alchimie) : Le nez sensible d’un gnome lui permet de surveiller les processus alchimiques par l’odorat." },
			{ "content": "Langues automatiques : le Commun et le Gnome. Langues bonus : Draconique, Nain, Elfe, Géant, Gobelin et Orque. Les gnomes interagissent plus avec les elfes et les nains que ces derniers entre eux, et ils apprennent aussi les langues de leurs ennemis (kobolds, géants, gobelins et orques). De plus, un gnome peut parler avec un mammifère fouisseur (comme un blaireau, un renard, un lapin, etc.). Cette capacité est innée chez les gnomes. Voir la description du sort parler aux animaux." },
			{ "content": "Capacités semblables à des sorts : 1/jour — parler aux animaux (uniquement avec les mammifères fouisseurs, durée 1 minute). Un gnome avec un score de Charisme d’au moins 10 possède également les capacités suivantes semblables à des sorts : 1/jour — lumières dansantes, son fantôme, prestidigitation. Niveau de lanceur de sorts 1 ; DD de sauvegarde 10 + modificateur de Cha du gnome + niveau du sort." },
			{ "content": "Classe de prédilection : Barde. Les niveaux de barde d’un gnome multiclassé ne comptent pas pour déterminer s’il subit une pénalité d’expérience." }
		]
	}
});
</script>
</body>
